<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Browse and filter all civil engineering, GIS, CAD, BIM, design and personal projects by Fiza Mansoor.">
    <title>All Projects | Fiza's Project Portfolio</title>
    <link rel="icon" type="image/png" href="../../assets/site-icon-favicon.png">
    <link rel="stylesheet" href="../../styles.css">
    <script src="../../supabase-config.js" defer></script>
    <script src="../../traffic.js" defer></script>
    <script src="../../projects.js?v=all-grid-placeholders-3" defer></script>
</head>
<body class="projects-page all-projects-page">
    <header>
        <nav aria-label="Main navigation">
            <a href="../../home/">Home</a>
            <a href="../../about-me/">About</a>
            <a href="../" aria-current="page">Projects</a>
            <a href="../../contact-me/">Contact</a>
        </nav>
    </header>
    <main id="main-content">
        <a class="project-back-link all-projects-back-link" href="../">&larr; Projects page</a>

        <section
            class="all-projects-archive"
            data-project-archive
            data-all-projects
            data-projects-source="../projects.json"
            >
            <section class="paper-panel all-projects-intro project-filters" aria-label="Project filters">
                <h1>All Projects</h1>
                <div class="project-filter-controls">
                    <label class="project-filter-field">
                        <span>Year</span>
                        <select data-project-filter="year">
                            <option value="all">All</option>
                            <option value="2027">2027</option>
                            <option value="2026">2026</option>
                            <option value="2025">2025</option>
                            <option value="earlier">Earlier</option>
                        </select>
                    </label>

                    <label class="project-filter-field">
                        <span>Project Type</span>
                        <select data-project-filter="type">
                            <option value="all">All</option>
                            <option value="civil-engineering">Civil Engineering</option>
                            <option value="gis">GIS</option>
                            <option value="cad-bim">CAD / BIM</option>
                            <option value="design">Design</option>
                            <option value="personal">Personal</option>
                        </select>
                    </label>

                    <label class="project-filter-field">
                        <span>Civil Engineering Discipline</span>
                        <select data-project-filter="discipline">
                            <option value="all">All</option>
                            <option value="structural-engineering">Structural Engineering</option>
                            <option value="geotechnical-engineering">Geotechnical Engineering</option>
                            <option value="transportation-engineering">Transportation Engineering</option>
                            <option value="highways-engineering">Highways Engineering</option>
                            <option value="water-engineering">Water Engineering</option>
                            <option value="water-resources">Water Resources</option>
                            <option value="urban-drainage-suds">Urban Drainage / SuDS</option>
                            <option value="environmental-engineering">Environmental Engineering</option>
                            <option value="construction-management">Construction Management</option>
                            <option value="surveying-geomatics">Surveying / Geomatics</option>
                            <option value="coastal-maritime-engineering">Coastal / Maritime Engineering</option>
                            <option value="bim-coordination">BIM Coordination</option>
                            <option value="numerical-modelling">Numerical Modelling</option>
                        </select>
                    </label>

                    <label class="project-filter-field">
                        <span>Software / Tools</span>
                        <select data-project-filter="tool">
                            <option value="all">All</option>
                            <option value="autocad">AutoCAD</option>
                            <option value="civil-3d">Civil 3D</option>
                            <option value="revit">Revit</option>
                            <option value="navisworks">Navisworks</option>
                            <option value="microstation">MicroStation</option>
                            <option value="openroads">OpenRoads</option>
                            <option value="tekla-structures">Tekla Structures</option>
                            <option value="robot-structural-analysis">Robot Structural Analysis</option>
                            <option value="sap2000">SAP2000</option>
                            <option value="etabs">ETABS</option>
                            <option value="plaxis">PLAXIS</option>
                            <option value="hec-ras">HEC-RAS</option>
                            <option value="infodrainage">InfoDrainage</option>
                            <option value="qgis">QGIS</option>
                            <option value="arcgis">ArcGIS</option>
                            <option value="excel">Excel</option>
                            <option value="matlab">MATLAB</option>
                            <option value="python">Python</option>
                            <option value="ms-project">Microsoft Project</option>
                            <option value="bluebeam-revu">Bluebeam Revu</option>
                            <option value="fusion-360">Fusion 360</option>
                            <option value="other">Other</option>
                        </select>
                    </label>

                    <label class="project-filter-field">
                        <span>Status</span>
                        <select data-project-filter="status">
                            <option value="all">All</option>
                            <option value="completed">Completed</option>
                            <option value="in-progress">In Progress</option>
                        </select>
                    </label>
                </div>

                <button class="project-filters-clear" type="button" data-clear-project-filters hidden>Clear filters</button>
            </section>

            <section class="paper-panel all-projects-results" aria-labelledby="all-projects-results-title">
                <h2 id="all-projects-results-title" class="sr-only">Projects</h2>
                <noscript>
                    <p class="projects-empty">Enable JavaScript to load and filter the project archive.</p>
                </noscript>
                <div class="posts-grid all-projects-grid" data-project-list="filtered" aria-live="polite" aria-busy="true">
                    <p class="projects-loading">Loading projects&hellip;</p>
                </div>
            </section>
        </section>
    </main>
    <footer>
        <p>&copy; 2027 Fiza's Project Portfolio. All rights reserved.</p>
        <p>Built from scratch by Fiza, without generative AI.</p>
    </footer>
</body>
</html>
